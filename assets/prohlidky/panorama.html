<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jedno panorama s markery – Photo Sphere Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.min.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.15.1/index.module.js",
      "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.15.1/index.module.js"
    }
  }
  </script>
  <style>
    html, body, #viewer { margin: 0; width: 100%; height: 100%; }
    #souradnice { position: absolute; z-index: 10; top: 10px; left: 10px; padding: 6px 10px; border-radius: 6px;
                  background: rgba(255,255,255,.9); font: 14px monospace; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <div id="souradnice">Klikněte do panoramatu…</div>

  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';
    import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

    const viewer = new Viewer({
      container: 'viewer',
      panorama: 'pano_B.jpg',               // sférická fotografie 2:1
      caption: 'U božích muk',
      defaultYaw: '110deg',                 // výchozí směr pohledu
      defaultPitch: '5deg',
      plugins: [
        MarkersPlugin.withConfig({
          markers: [
            {   // bod s tooltipem a obsahem v bočním panelu
              id: 'muka',
              position: { yaw: '108deg', pitch: '20deg' },
              html: '<b style="font-size:28px">ⓘ</b>',
              anchor: 'center center',
              tooltip: 'Boží muka',
              content: '<h2>Boží muka</h2><p>Kamenný sloup s kaplicí na rozcestí.</p>',
            },
            {   // polygon vymezující oblast v panoramatu (yaw, pitch ve stupních)
              id: 'kaple',
              polygon: [['-33deg', '4deg'], ['-17deg', '4deg'], ['-17deg', '13deg'], ['-25deg', '23deg'], ['-33deg', '13deg']],
              svgStyle: { fill: 'rgba(241,175,52,0.25)', stroke: '#f1af34', strokeWidth: '2px' },
              tooltip: 'Kaple sv. Jana',
            },
          ],
        }),
      ],
    });

    // pomocník: po kliknutí vypíše yaw/pitch – hodí se pro umisťování markerů
    viewer.addEventListener('click', ({ data }) => {
      const deg = (r) => (r * 180 / Math.PI).toFixed(1);
      const txt = `yaw: '${deg(data.yaw)}deg', pitch: '${deg(data.pitch)}deg'`;
      document.querySelector('#souradnice').textContent = txt;
      console.log(`position: { ${txt} }`);
    });
  </script>
</body>
</html>
