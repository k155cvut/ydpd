<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaple v krajině – Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #panel { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.92); border-radius: 10px;
             padding: 12px 14px; max-width: 280px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
    #panel h1 { font-size: 16px; margin: 0 0 8px; color: #074173; }
    #panel button { margin: 3px 3px 0 0; padding: 6px 10px; border: 1px solid #074173; background: #fff;
                    color: #074173; border-radius: 6px; cursor: pointer; }
    #panel button:hover { background: #074173; color: #fff; }
    #vyber { margin-top: 8px; font-size: 13px; color: #4a5568; }
  </style>
  <!-- import map: knihovny se načtou jako ES moduly z CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="panel">
    <h1>Kaple v krajině</h1>
    <div>
      <button data-bod="celek">Celek</button>
      <button data-bod="A">Před kaplí</button>
      <button data-bod="B">Boží muka</button>
      <button data-bod="C">Cesta</button>
    </div>
    <div id="vyber">Klikněte na objekt ve scéně.</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1) renderer, scéna, kamera
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfe0ee);
    scene.fog = new THREE.Fog(0xcfe0ee, 150, 420);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.set(-110, 80, 140);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;   // kamera nepodleze terén

    // 2) světla: obloha + slunce se stíny
    scene.add(new THREE.HemisphereLight(0xdfeeff, 0x4a5a30, 1.2));
    const sun = new THREE.DirectionalLight(0xfff4e0, 2.5);
    sun.position.set(-80, 120, 90);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.bias = -0.0005;      // potlačí „pruhy“ stínů (shadow acne)
    sun.shadow.normalBias = 0.4;
    Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, far: 400 });
    scene.add(sun);

    // 3) načtení modelu ve formátu glTF/GLB
    new GLTFLoader().load('scena.glb', (gltf) => {
      gltf.scene.traverse((o) => {
        if (o.isMesh) {
          o.receiveShadow = true;
          o.castShadow = !o.name.startsWith('teren');   // terén stín jen přijímá
        }
      });
      scene.add(gltf.scene);
    }, undefined, (err) => console.error('Model se nenačetl:', err));

    // 4) přednastavené pohledy (souřadnice glTF: x = východ, y = výška, z = jih)
    const pohledy = {
      celek: { kamera: [-110, 80, 140], cil: [0, 4, 0] },
      A: { kamera: [0, 0, 16], cil: [0, 4, 0] },
      B: { kamera: [19.5, -3.4, 41.5], cil: [22.5, -3, 42.5] },
      C: { kamera: [64, -3.3, 71.5], cil: [0, 4, 0] },
    };
    document.querySelectorAll('[data-bod]').forEach((b) => b.addEventListener('click', () => {
      const p = pohledy[b.dataset.bod];
      camera.position.set(...p.kamera);
      controls.target.set(...p.cil);
    }));

    // 5) výběr objektu kliknutím (raycasting)
    const raycaster = new THREE.Raycaster();
    const mys = new THREE.Vector2();
    renderer.domElement.addEventListener('click', (e) => {
      mys.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(mys, camera);
      const zasah = raycaster.intersectObjects(scene.children, true)[0];
      if (zasah) {
        const p = zasah.point;
        document.querySelector('#vyber').textContent =
          `${zasah.object.name}  ·  x ${p.x.toFixed(1)}, y ${p.y.toFixed(1)}, z ${p.z.toFixed(1)} m`;
      }
    });

    // 6) smyčka vykreslování a změna velikosti okna
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  </script>
</body>
</html>
